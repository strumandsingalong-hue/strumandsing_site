<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Strum &amp; Sing Coach</title>
  <meta name="description" content="Learn any song on guitar with Rai, your strum & sing coach — chord by chord, then hum, then strum and sing along.">
  <meta name="theme-color" content="#18233a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Strum Coach">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button class="stage" id="stage" aria-label="RaiN, your coach. Tap to skip what she's saying">
      <span class="stage-face" id="stageFace"></span>
      <span class="stage-text">
        <span class="stage-name">RaiN <small id="stageStatus">Strum &amp; Sing coach</small></span>
        <span class="stage-caption" id="caption">Hi! Tap start to meet me.</span>
      </span>
    </button>
    <div class="top-actions">
      <button class="icon-btn" id="voiceBtn" aria-label="RaiN's voice on" aria-pressed="true">
        <svg viewBox="0 0 24 24" class="on"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
        <svg viewBox="0 0 24 24" class="off"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="m17 9 5 6m0-6-5 6"/></svg>
      </button>
      <button class="icon-btn" id="songsBtn" aria-label="My songs">
        <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </button>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
      </button>
    </div>
  </header>

  <div class="progress" id="progress" hidden>
    <button class="progress-inner" id="progressBtn" aria-label="Lesson steps">
      <span class="progress-song" id="progressSong"></span>
      <span class="progress-dots" id="progressDots"></span>
      <span class="progress-count" id="progressCount"></span>
    </button>
  </div>

  <main class="thread" id="thread" aria-live="polite"></main>

  <footer class="composer">
    <div class="quick" id="quick"></div>
    <form class="input-row" id="form" autocomplete="off">
      <input id="input" type="text" placeholder="Tell RaiN a song…" aria-label="Message RaiN" enterkeyhint="send">
      <button type="button" class="mic" id="micBtn" aria-label="Talk to RaiN" hidden>
        <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <button class="send" id="send" aria-label="Send">
        <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
  </footer>

  <div class="splash" id="splash">
    <div class="splash-inner">
      <div class="splash-face" id="splashFace"></div>
      <div class="splash-brand">
        <svg class="pick" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 60C24 50 8 34 8 20 8 10 19 4 32 4s24 6 24 16c0 14-16 30-24 40Z" fill="var(--clay)"/><path d="M29 40a5 5 0 1 1-2.2-4.2V16h2.4c.6 3.6 3.4 5.4 7.4 6.6v3.6c-3.2-.6-5.6-1.8-7.4-3.4V40Z" fill="#fff"/></svg>
        Strum &amp; Sing
      </div>
      <h1>Learn any song<br>with <em>RaiN</em></h1>
      <p>Your guitar coach. Tell her a song, she'll work out the chords and capo for your hands, then teach it step by step.</p>
      <button class="btn clay big" id="startVoice">Talk with RaiN</button>
      <button class="btn link" id="startQuiet">Start in quiet mode</button>
      <a class="btn link" href="../" style="font-size:14px">← Back to strumandsing.co.uk</a>
    </div>
  </div>

  <div class="sheet-backdrop" id="backdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></section>

  <script type="module" src="app.js"></script>
</body>
</html>
